name: Template Init

# One-time cleanup that runs on the first push to a repo GENERATED from this
# template. Edit the `if:` below to this template's own `owner/repo` so it
# never fires on the template repository itself. See README.md.

on:
  push:
    branches: [main]

jobs:
  init:
    if: github.repository != 'YOUR_ORG/YOUR_TEMPLATE_REPO_NAME'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check if already initialized
        id: check
        run: |
          if [ -f .github/.template-initialized ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mark initialized and remove this workflow
        if: steps.check.outputs.skip == 'false'
        run: |
          mkdir -p .github
          touch .github/.template-initialized
          rm -f .github/workflows/template-init.yml
          git config user.name "template-init-bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "chore: initialize from template"
          git push
